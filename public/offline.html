<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Hult Prize KCE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(236, 72, 153, 0.3);
    }
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: #ec4899;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: white;
    }
    h1 {
      color: #ec4899;
      font-size: 32px;
      margin-bottom: 16px;
    }
    p {
      color: #6b7280;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      background: #ec4899;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      background: #db2777;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
    }
    .features {
      margin-top: 40px;
      text-align: left;
      background: #fce7f3;
      padding: 20px;
      border-radius: 12px;
    }
    .features h3 {
      color: #ec4899;
      margin-bottom: 16px;
      font-size: 18px;
    }
    .features ul {
      list-style: none;
    }
    .features li {
      padding: 8px 0;
      color: #6b7280;
      display: flex;
      align-items: center;
    }
    .features li:before {
      content: "✓";
      color: #ec4899;
      font-weight: bold;
      margin-right: 12px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      📡
    </div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry, you can still access some features of the Hult Prize KCE app!</p>
    
    <button class="btn" onclick="window.location.reload()">
      Try Again
    </button>

    <div class="features">
      <h3>Available Offline:</h3>
      <ul>
        <li>View cached pages</li>
        <li>See your profile information</li>
        <li>Browse previously loaded events</li>
        <li>Access app interface</li>
      </ul>
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
